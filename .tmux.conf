# ============================================================================
# tmux config — session management for the nvim + Claude Code workflow.
# Prefix stays C-b. Tokyo Night status bar, no plugin manager required.
# ============================================================================

# --- Colors / terminal ------------------------------------------------------
set -g default-terminal "tmux-256color"
# True color (24-bit). Covers Ghostty and standard 256-color terminals.
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc,*256col*:Tc"

# --- General behavior -------------------------------------------------------
set -g mouse on                 # click panes/windows, drag to resize, scroll
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # keep window numbers gap-free
set -g history-limit 50000      # bigger scrollback
set -sg escape-time 0           # no delay for Esc (important for nvim)
set -g focus-events on          # let nvim know about focus (autoread, etc.)
set -g set-clipboard on

# --- Reload config ----------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# --- Splits: | horizontal, - vertical, open in the current path -------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- vi-style copy mode -----------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- Seamless nvim <-> tmux pane navigation (vim-tmux-navigator) ------------
# Ctrl-h/j/k/l moves between panes; inside nvim it moves between splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --- Tokyo Night status bar -------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7]"

set -g status-right-length 80
set -g status-right "#[fg=#414868]#[bg=#414868,fg=#a9b1d6] %a %d %b #[fg=#7aa2f7]#[bg=#7aa2f7,fg=#1a1b26,bold] %H:%M "

setw -g window-status-format "#[fg=#a9b1d6] #I:#W "
setw -g window-status-current-format "#[bg=#414868,fg=#7aa2f7,bold] #I:#W "

set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#1a1b26"
