# ============================================================================
# Herdr — terminal workspace manager for the nvim + Claude Code workflow.
# Replaces tmux. Prefix is ctrl+space. Theme matches Neovim (Tokyo Night Night).
#
# Session state lives beside this file in ~/.config/herdr/:
#   session.json          workspaces, tab/pane layout, working directories
#   session-history.json  pane scrollback (enabled below)
# Herdr restores both when the server next starts, so a Coder workspace that
# shuts down overnight comes back with the layout intact. install.sh copies
# only this file and never clears the directory.
#
# Full annotated reference: `herdr --default-config`
# ============================================================================

# We ship a config, so skip the first-run notification wizard.
onboarding = false

# --- Theme -------------------------------------------------------------------
# Herdr ships a built-in "tokyo-night", but which upstream variant it tracks is
# not guaranteed across releases. The [theme.custom] block below pins every
# token to Tokyo Night *Night* — the same variant .config/nvim/init.lua sets via
# `style = "night"` — so nvim and Herdr stay in lockstep. Change both together.
#
# Night rather than Storm because Storm's #24283b reads visibly blue against a
# dark Ghostty background. Only the background family differs between the two
# variants; every accent below is identical in both.
[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
panel_bg    = "#16161e"  # bg_dark      — sidebar / chrome background
surface0    = "#292e42"  # bg_highlight — raised rows, selected sidebar entry
surface1    = "#3b4261"  # fg_gutter    — borders, dividers
surface_dim = "#1a1b26"  # bg           — matches nvim's editor background
overlay0    = "#545c7e"  # dark3        — inactive borders, muted glyphs
overlay1    = "#737aa2"  # dark5        — secondary chrome
text        = "#c0caf5"  # fg           — primary text
subtext0    = "#a9b1d6"  # fg_dark      — secondary text
accent      = "#7aa2f7"  # blue         — active pane border, highlights
blue        = "#7aa2f7"
mauve       = "#bb9af7"  # magenta
green       = "#9ece6a"
yellow      = "#e0af68"
red         = "#f7768e"
teal        = "#73daca"  # green1
peach       = "#ff9e64"  # orange

# --- Session persistence -----------------------------------------------------
[session]
# Reattach agent panes to their native conversation sessions after a server
# restart — Claude Code picks up the same conversation, not a blank prompt.
# Requires the hook from `herdr integration install claude` (install.sh does it).
resume_agents_on_restore = true

# --- Terminal ----------------------------------------------------------------
[terminal]
# Named explicitly rather than left empty (which would fall back to $SHELL, then
# /bin/sh). We standardise on zsh both locally and in the Coder workspace, and a
# fresh Coder box can still report $SHELL=/bin/bash if chsh hasn't taken effect
# in the current session — this makes panes deterministic either way. Resolved
# via PATH, so it works regardless of /bin/zsh vs /usr/bin/zsh.
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"      # new panes/tabs inherit the source pane's directory

# --- Keys --------------------------------------------------------------------
# ctrl+space instead of the default ctrl+b: it collides with nothing in zsh or
# nvim, and it's a thumb press rather than a stretch.
#
# Frequent actions also get a direct ctrl+alt chord so you can skip the prefix
# entirely. ctrl+alt is the combo Herdr documents as most reliable across
# terminals. Note ctrl+h/j/k/l is deliberately NOT bound here — that stays with
# Neovim for window movement, since Herdr has no vim-tmux-navigator equivalent.
[keys]
prefix = "ctrl+space"

# Panes
focus_pane_left      = ["prefix+h", "ctrl+alt+h"]
focus_pane_down      = ["prefix+j", "ctrl+alt+j"]
focus_pane_up        = ["prefix+k", "ctrl+alt+k"]
focus_pane_right     = ["prefix+l", "ctrl+alt+l"]
split_vertical       = ["prefix+v", "ctrl+alt+v"]   # split right
split_horizontal     = ["prefix+minus", "ctrl+alt+s"]  # split down
zoom                 = ["prefix+z", "ctrl+alt+z"]
close_pane           = "prefix+x"
resize_mode          = "prefix+r"
last_pane            = "prefix+semicolon"
cycle_pane_next      = "prefix+tab"
cycle_pane_previous  = "prefix+shift+tab"
rename_pane          = "prefix+shift+p"
edit_scrollback      = "prefix+e"
copy_mode            = "prefix+["

# Tabs
new_tab       = "prefix+c"
next_tab      = ["prefix+n", "ctrl+alt+]"]
previous_tab  = ["prefix+p", "ctrl+alt+["]
switch_tab    = "prefix+1..9"
rename_tab    = "prefix+shift+t"
close_tab     = "prefix+shift+x"

# Workspaces (the level above tabs — one per project, typically)
new_workspace     = "prefix+shift+n"
rename_workspace  = "prefix+shift+w"
close_workspace   = "prefix+shift+d"
workspace_picker  = "prefix+w"
switch_workspace  = "prefix+shift+1..9"
next_workspace    = "prefix+shift+right"
previous_workspace = "prefix+shift+left"

# Git worktrees — Herdr can spin a workspace up on its own worktree.
new_worktree = "prefix+shift+g"

# Agents
focus_agent    = "prefix+alt+1..9"
next_agent     = "prefix+shift+j"
previous_agent = "prefix+shift+k"

# Session / UI
detach                   = "prefix+q"
goto                     = "prefix+g"
toggle_sidebar           = ["prefix+b", "ctrl+alt+b"]
help                     = "prefix+?"
settings                 = "prefix+s"
reload_config            = "prefix+shift+r"
open_notification_target = "prefix+o"

# Jump straight into a Claude Code pane.
[[keys.command]]
key = "prefix+alt+c"
type = "pane"
command = "claude"
description = "Claude Code in a new pane"

# Scratch git log without disturbing the layout.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "git log --graph --oneline --decorate --all --color=always | less -R"
description = "git graph"
width = "85%"
height = "80%"

# --- Worktrees ---------------------------------------------------------------
[worktrees]
directory = "~/.herdr/worktrees"

# --- UI ----------------------------------------------------------------------
[ui]
accent = "#7aa2f7"              # Tokyo Night blue, same as theme accent
sidebar_width = 28
sidebar_min_width = 20
sidebar_max_width = 40
sidebar_collapsed_mode = "compact"
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true   # label panes by detected agent
hide_tab_bar_when_single_tab = true        # less chrome when there's one tab
prompt_new_tab_name = false                # ctrl+space c makes a tab immediately
prompt_new_workspace_name = true           # ...but name workspaces, they're projects
confirm_close = true
copy_on_select = true
mouse_capture = true
mouse_scroll_lines = 3

# Sidebar: agent rows. Claude gets an extra line showing what it's working on.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent", "state_text"],
]

# Sidebar: workspace rows, with git branch and dirty state.
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

# In-app toasts when a background agent finishes or needs input. "herdr" rather
# than "system"/"terminal" because this runs over SSH on a headless Coder box,
# where there is no desktop notification service to talk to.
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

# No audio device on a Coder workspace.
[ui.sound]
enabled = false

# --- Remote ------------------------------------------------------------------
[remote]
# Keep Herdr's generated ssh config: it adds ServerAliveInterval fallbacks that
# stop an idle `herdr --remote` attach from dying to a NAT timeout. Anything you
# set in ~/.ssh/config still wins.
manage_ssh_config = true

# --- Experimental ------------------------------------------------------------
[experimental]
# Persist pane scrollback across full server restarts. This is the setting that
# makes an overnight Coder shutdown survivable with output intact, not just the
# layout — it writes ~/.config/herdr/session-history.json.
pane_history = true
allow_nested = false

# --- Advanced ----------------------------------------------------------------
[advanced]
scrollback_limit_bytes = 10000000
